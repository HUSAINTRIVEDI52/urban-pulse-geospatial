services:
  # ----------------------------------------------------------------------------
  # PostGIS Spatial Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: urbanpulse-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urbanpulse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-urbanpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: urbanpulse-api
    ports:
      - "8000:8000"
    volumes:
      - ./web/data:/app/web/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-urbanpulse}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Web Frontend (Nginx)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: urbanpulse-web
    ports:
      - "8080:80"
    volumes:
      - ./web/data:/usr/share/nginx/html/data:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Satellite Processing Pipeline (On-Demand Tool)
  # ----------------------------------------------------------------------------
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    container_name: urbanpulse-pipeline
    profiles:
      - tools
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./configs:/app/configs:ro
      - ./web/data:/app/web/data
      - ./db:/app/db:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-urbanpulse}
      - PUSHGATEWAY_URL=http://pushgateway:9091
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Monitoring Services (Profile: monitoring)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: urbanpulse-prometheus
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.8.0
    container_name: urbanpulse-pushgateway
    profiles:
      - monitoring
    ports:
      - "9091:9091"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: urbanpulse-grafana
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
    name: urbanpulse_pgdata
  promdata:
    name: urbanpulse_promdata
  grafanadata:
    name: urbanpulse_grafanadata

