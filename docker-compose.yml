services:
  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: urbanpulse-api
    ports:
      - "8000:8000"
    volumes:
      - ./web/data:/app/web/data:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Web Frontend (Nginx)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: urbanpulse-web
    ports:
      - "8080:80"
    volumes:
      - ./web/data:/usr/share/nginx/html/data:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Satellite Processing Pipeline (On-Demand Tool)
  # ----------------------------------------------------------------------------
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    container_name: urbanpulse-pipeline
    profiles:
      - tools
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./configs:/app/configs:ro
      - ./web/data:/app/web/data
    environment:
      - PYTHONUNBUFFERED=1
