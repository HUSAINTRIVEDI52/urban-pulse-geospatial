---
- name: Check if k3s binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download and execute official k3s installer
  ansible.builtin.shell:
    cmd: >-
      curl -sfL https://get.k3s.io |
      INSTALL_K3S_EXEC="{{ k3s_install_args }}" sh -
  when: not k3s_binary.stat.exists
  changed_when: true

- name: Ensure k3s service is enabled and started
  ansible.builtin.service:
    name: k3s
    state: started
    enabled: true

- name: Create .kube directory for deployment user
  ansible.builtin.file:
    path: "/home/{{ k3s_user }}/.kube"
    state: directory
    owner: "{{ k3s_user }}"
    group: "{{ k3s_user }}"
    mode: "0755"

- name: Copy k3s kubeconfig to deployment user home
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ k3s_user }}/.kube/config"
    remote_src: true
    owner: "{{ k3s_user }}"
    group: "{{ k3s_user }}"
    mode: "0600"
