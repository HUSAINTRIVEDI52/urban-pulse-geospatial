---
- name: Update apt cache and upgrade system packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install common essential packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Create non-root deployment user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: "{{ deploy_user_shell }}"
    groups: sudo
    append: true
    state: present
    create_home: true

- name: Enable passwordless sudo for deployment user
  ansible.builtin.copy:
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    mode: "0440"
    validate: "visudo -cf %s"

- name: Set up authorized SSH key for deployment user
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: >-
      {{ lookup('file', ssh_public_key_file, errors='ignore')
         | default(lookup('file',
                   '/root/.ssh/authorized_keys', errors='ignore'))
         | default(omit) }}
    state: present

- name: Harden SSH daemon configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: "/usr/sbin/sshd -t -f %s"
  loop:
    - regexp: "^#?PasswordAuthentication"
      line: "PasswordAuthentication no"
    - regexp: "^#?PermitEmptyPasswords"
      line: "PermitEmptyPasswords no"
    - regexp: "^#?PubkeyAuthentication"
      line: "PubkeyAuthentication yes"
    - regexp: "^#?X11Forwarding"
      line: "X11Forwarding no"
  notify: Restart sshd

- name: Configure automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"
