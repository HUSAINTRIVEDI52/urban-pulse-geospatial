---
- name: Ensure remote project directory exists
  ansible.builtin.file:
    path: "{{ deploy_project_remote_dir }}/infra/k8s"
    state: directory
    owner: "{{ common_deploy_user | default(deploy_user | default('urbanpulse')) }}"
    group: "{{ common_deploy_user | default(deploy_user | default('urbanpulse')) }}"
    mode: "0755"

- name: Copy Kubernetes manifests to remote server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s/"
    dest: "{{ deploy_project_remote_dir }}/infra/k8s/"
    owner: "{{ common_deploy_user | default(deploy_user | default('urbanpulse')) }}"
    group: "{{ common_deploy_user | default(deploy_user | default('urbanpulse')) }}"
    mode: "0644"

- name: Apply Kubernetes Kustomize overlay to k3s cluster
  ansible.builtin.command:
    cmd: "kubectl apply -k {{ deploy_k8s_overlay_dir }}"
  environment:
    KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
  register: kubectl_apply
  changed_when: >-
    'configured' in kubectl_apply.stdout or
    'created' in kubectl_apply.stdout

- name: Wait for API deployment rollout to complete
  ansible.builtin.command:
    cmd: >-
      kubectl rollout status deployment/api
      -n urbanpulse --timeout={{ deploy_timeout }}
  environment:
    KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
  changed_when: false

- name: Wait for Web deployment rollout to complete
  ansible.builtin.command:
    cmd: >-
      kubectl rollout status deployment/web
      -n urbanpulse --timeout={{ deploy_timeout }}
  environment:
    KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"
  changed_when: false
