apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: urbanpulse
  labels:
    app.kubernetes.io/name: urbanpulse
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: urbanpulse
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: urbanpulse
  labels:
    app.kubernetes.io/name: urbanpulse
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: urbanpulse
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urbanpulse
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: urbanpulse-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: urbanpulse-db-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: shared-data
              mountPath: /app/web/data
              subPath: web/data
              readOnly: true
            - name: city-configs
              mountPath: /app/configs
              readOnly: true
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: urbanpulse-data-pvc
        - name: city-configs
          configMap:
            name: urbanpulse-city-configs
