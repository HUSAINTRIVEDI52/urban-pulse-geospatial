name: UrbanPulse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Linting & Formatting Check
  # ----------------------------------------------------------------------------
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Formatter Check
        run: black --check .

  # ----------------------------------------------------------------------------
  # 2. Automated Test Suite (Synthetic In-Memory Data)
  # ----------------------------------------------------------------------------
  test:
    name: Pytest Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Pytest Suite
        run: pytest -v

  # ----------------------------------------------------------------------------
  # 3. Docker Multi-Image Builds with Layer Caching
  # ----------------------------------------------------------------------------
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
            image: urbanpulse-api:latest
          - service: web
            dockerfile: docker/Dockerfile.web
            image: urbanpulse-web:latest
          - service: pipeline
            dockerfile: docker/Dockerfile.pipeline
            image: urbanpulse-pipeline:latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Save Docker Image Artifact for Security Scanning
        run: |
          mkdir -p /tmp/images
          docker save -o /tmp/images/${{ matrix.service }}.tar ${{ matrix.image }}

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/images/${{ matrix.service }}.tar
          retention-days: 1

  # ----------------------------------------------------------------------------
  # 4. Trivy Security Vulnerability Scan
  # ----------------------------------------------------------------------------
  scan:
    name: Trivy Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: docker
    strategy:
      matrix:
        service: [api, web, pipeline]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/images

      - name: Load Docker Image
        run: docker load -i /tmp/images/${{ matrix.service }}.tar

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: urbanpulse-${{ matrix.service }}:latest
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
