global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # 1. Scrape FastAPI Backend
  - job_name: "urbanpulse-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000", "localhost:8000", "127.0.0.1:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # 2. Scrape Prometheus Pushgateway (Pipeline metrics)
  - job_name: "urbanpulse-pushgateway"
    static_configs:
      - targets: ["pushgateway:9091", "localhost:9091", "127.0.0.1:9091"]
    honor_labels: true

  # 3. Scrape Prometheus Self
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
